# SonarCloud: https://sonarcloud.io (organization + project must exist there)
sonar.organization=skluba
# Create the project in SonarCloud (or import from GitHub); key must match exactly.
sonar.projectKey=skluba_prompt-engineering-and-ai-applications
sonar.projectName=Prompt Engineering and AI Applications

sonar.host.url=https://sonarcloud.io

sonar.sources=app,streamlit_app.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# pytest-cov / coverage.py XML (generated in CI before Sonar scan)
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,.venv/**,venv/**
