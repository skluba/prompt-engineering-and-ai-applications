[project]
name = "conversational-ai-data"
version = "0.1.0"
description = "Conversational AI: synthetic data and natural-language SQL querying"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
omit = ["*/tests/*"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
